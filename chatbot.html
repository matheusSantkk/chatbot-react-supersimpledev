<!doctype html>
<html>
  <head>
    <title>ChatBot</title>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput() {
        return (
          <>
            <input placeholder="Send a message to Chatbot" size="30" />
            <button>Send</button>
          </>
        );
      }

      function ChatMessage({ message, sender }) {
        return (
          <div>
            {sender === "robot" && <img src="img/robot.png" width="50" />}
            {message}
            {sender === "user" && <img src="img/user.png" width="50" />}
          </div>
        );
      }

      function ChatMessages() {
        const [chatMessages, setChatMessages] = React.useState([

          {
            message: "Hello Chatbot",
            sender: "user",
            key: "id1",
          },
          {
            message: "Hello! How I can help you?",
            sender: "robot",
            key: "id2",
          },
          {
            message: "can you get me todays date?",
            sender: "user",
            key: "id3",
          },
          {
            message: "Today is October 30",
            sender: "robot",
            key: "id4",
          },
        ]);
        
        function sendMessage() { 
          setChatMessages([
            ...chatMessages,
            {
              message: 'teste',
              sender: 'user',
              key: crypto.randomUUID()
            } 
          ])
        }

        return (
          <>
            <button onClick={sendMessage}>send message</button>
            {chatMessages.map(({ key, message, sender }) => {
              return (
                <ChatMessage key={key} message={message} sender={sender} />
              );
            })}
          </>
        );
      }

      function App() {
        return (
          <>
            <ChatInput />
            <ChatMessages />
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
